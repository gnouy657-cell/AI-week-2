<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Week 2 of AI SheCodes</h1>
      </header>

      <main>
        <div class="form-container">
          <form id="poem-form">
            <input
              type="text"
              placeholder="Enter topic of poem you want to generate..."
              autofocus
              required
              autocomplete="off"
              class="topic"
              id="user-input"
            />
            <input type="submit" class="submit-button" />
          </form>
          <div class="form-hint">i.e. Flowers, Children or Love</div>
        </div>
      </main>
      <div class="poem-container hidden" id="poem-container"></div>
      <footer>
        This AI poem generator was coded by
        <a href="https://github.com/gnouy657-cell" target="_blank">
          Brooke Thao
        </a>
        and is open-sourced on
        <a href="https://github.com/gnouy657-cell/AI-week-2" target="_blank">
          GitHub
        </a>
        and is hosted on
        <a
          href="https://transcendent-tulumba-07f744.netlify.app/"
          target="_blank"
        >
          Netlify.
        </a>
      </footer>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
